name: ✨ 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해주세요
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 겪고 있는 불편함이나 한계를 먼저 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결책
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
    validations:
      required: false
